name: Make Tweet Audio

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install gtts

      - name: Run script
        run: python make_video.py

      - name: Upload Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tweet-audio
          path: tweet_audio.mp3
